services:
  - type: web
    name: telegram-onedrive-standby
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: BOT_MODE
        value: standby
      - key: DOWNLOAD_BASE_URL
        value: https://telegram-onedrive-standby.onrender.com
      - key: TRANSFER_BACKEND
        value: actions
      - key: ACTIONS_REPO
        value: ncd03-nb/telegram-onedrive-bot
      - key: ACTIONS_REF
        value: main
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: /data
      - key: RCLONE_CONFIG
        value: /config/rclone.conf
      - key: GOOGLE_TOKEN_PATH
        value: /config/google-token.json
      - key: MAX_FILE_GIB
        value: 12
      - key: MAX_SPOOL_MIB
        value: 0
      - key: RETENTION_HOURS
        value: 12
      - key: CLEANUP_INTERVAL_SECONDS
        value: 60
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: RCLONE_CONFIG_B64
        sync: false
      - key: GOOGLE_TOKEN_B64
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
